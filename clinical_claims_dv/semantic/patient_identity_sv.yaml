name: PATIENT_IDENTITY_SV
description: >-
  Identified patient lookup for authorized PHI_READER users. Resolves a patient's name, birth date or
  location to PATIENT_ID so the de-identified Clinical & Claims agent can be asked about that patient.
  Rows are returned only when PHI_READER is in session (row access policy PHI_ONLY).
tables:
  - name: PATIENT_IDENTITY
    description: One row per patient with name, birth date and location. Restricted to PHI_READER.
    base_table:
      database: CLINICAL_CLAIMS_DV
      schema: MARTS
      table: PATIENT_IDENTITY
    primary_key:
      columns: [PATIENT_ID]
    dimensions:
      - name: PATIENT_ID
        expr: PATIENT_ID
        data_type: NUMBER
        description: Patient business key. Pass this ID to the Clinical & Claims agent.
        synonyms: [patient id, member id, patient number]
      - name: FIRST_NAME
        expr: FIRST_NAME
        data_type: VARCHAR
        description: Patient first (given) name. Synthea names may contain digits, e.g. 'Hollis' or 'Hollis123'; match with ILIKE.
        synonyms: [given name, first]
      - name: LAST_NAME
        expr: LAST_NAME
        data_type: VARCHAR
        description: Patient last (family) name. Match case-insensitively with ILIKE and a trailing wildcard.
        synonyms: [surname, family name, last]
      - name: FULL_NAME
        expr: FULL_NAME
        data_type: VARCHAR
        description: First and last name separated by a space.
        synonyms: [name, patient name]
      - name: GENDER
        expr: GENDER
        data_type: VARCHAR
        description: "Gender: M or F."
      - name: AGE_BAND
        expr: AGE_BAND
        data_type: VARCHAR
        description: "Age group: 0-17, 18-34, 35-49, 50-64, 65+."
      - name: CITY
        expr: CITY
        data_type: VARCHAR
        description: City of residence.
      - name: COUNTY
        expr: COUNTY
        data_type: VARCHAR
        description: County of residence.
      - name: STATE
        expr: STATE
        data_type: VARCHAR
        description: US state of residence (full name, e.g. Ohio).
      - name: IS_ALIVE
        expr: IS_ALIVE
        data_type: BOOLEAN
        description: True if the patient has no recorded death date.
    time_dimensions:
      - name: BIRTHDATE
        expr: BIRTHDATE
        data_type: DATE
        description: Date of birth.
        synonyms: [dob, date of birth]
    facts:
      - name: AGE
        expr: AGE
        data_type: NUMBER
        description: Age in years.
    metrics:
      - name: MATCHING_PATIENTS
        expr: COUNT(DISTINCT PATIENT_ID)
        description: Number of patients matching the lookup criteria.
verified_queries:
  - name: lookup_by_last_name
    question: Find patients with last name Becker
    sql: >-
      SELECT PATIENT_ID, FULL_NAME, BIRTHDATE, CITY, STATE FROM patient_identity
      WHERE LAST_NAME ILIKE 'Becker%' ORDER BY LAST_NAME, FIRST_NAME
    verified_by: Claude (workathon demo)
    verified_at: 1792800000
  - name: lookup_by_full_name
    question: What is the patient ID for Hollis Dicki?
    sql: >-
      SELECT PATIENT_ID, FULL_NAME, BIRTHDATE, CITY, STATE FROM patient_identity
      WHERE FIRST_NAME ILIKE 'Hollis%' AND LAST_NAME ILIKE 'Dicki%'
    verified_by: Claude (workathon demo)
    verified_at: 1792800000
